<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Аукцион — торгуйся!</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:linear-gradient(135deg,#0f1b33,#1a2f4d);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center}
.screen{display:none;width:100%;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.screen.on{display:flex}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:36px;text-align:center;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
h1{font-size:34px;margin-bottom:10px}
.sub{color:#9fb3d1;margin-bottom:24px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font-size:17px;text-align:center;outline:none;margin-bottom:14px}
input:focus{border-color:#ffd54a}
button{cursor:pointer;border:none;border-radius:12px;font-size:16px;padding:12px 20px;transition:.15s}
button:hover{filter:brightness(1.15)}
.big{width:100%;padding:15px;font-size:18px;font-weight:700;background:linear-gradient(90deg,#ffd54a,#ffb300);color:#3a2a00}
.ghost{background:rgba(255,255,255,.12);color:#fff;margin-top:10px}
.exitbtn{background:linear-gradient(90deg,#ff7043,#e64a19);color:#fff;font-weight:700}
.game{width:100%;height:100vh;display:none;flex-direction:column}
.game.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:rgba(0,0,0,.35);gap:10px;flex-wrap:wrap}
.top .logo{font-size:20px;font-weight:700}
.top .info{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.money{color:#ffd54a;font-weight:700}
.wrap{flex:1;display:flex;overflow:hidden}
.left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow:auto}
.itempic{font-size:110px;line-height:1;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.itemname{font-size:30px;font-weight:700;margin:14px 0 6px;text-align:center}
.itemdesc{color:#9fb3d1;text-align:center;max-width:420px}
.board{margin-top:22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:18px 30px;text-align:center;min-width:320px}
.bidval{font-size:40px;font-weight:800;color:#ffd54a}
.leader{margin-top:4px;color:#9fb3d1}
.timer{margin-top:8px;font-size:14px;color:#81d4fa}
.bids{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bids button{background:rgba(255,255,255,.12);color:#fff;font-weight:700;padding:12px 18px}
.bids button.go{background:linear-gradient(90deg,#ffd54a,#ffb300);color:#3a2a00}
.bids button:disabled{opacity:.35;cursor:default}
.hint{margin-top:10px;font-size:13px;color:#ff8a65;min-height:18px}
.right{width:360px;background:rgba(0,0,0,.35);border-left:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column}
.chathead{padding:12px 16px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.12)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:14px;max-width:95%;word-break:break-word}
.msg.sys{background:rgba(129,212,250,.12);color:#81d4fa;font-size:13px}
.msg.win{background:rgba(255,213,74,.15);color:#ffd54a}
.msg .who{font-weight:700;color:#ffd54a}
.chatinput{display:flex;padding:10px;gap:8px;border-top:1px solid rgba(255,255,255,.12)}
.chatinput input{margin:0;text-align:left;font-size:14px;padding:10px}
.chatinput button{padding:10px 16px;background:#ffd54a;color:#3a2a00;font-weight:700}
.lots{display:flex;gap:6px;justify-content:center;padding:0 10px 10px}
.lotdot{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.2)}
.lotdot.cur{background:#ffd54a}.lotdot.done{background:#66bb6a}
.final{max-width:760px;width:100%;overflow:auto}
.final table{width:100%;border-collapse:collapse;margin-top:14px}
.final td,.final th{padding:10px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;font-size:15px}
.final th{color:#9fb3d1;font-weight:600}
.medal{font-size:22px}
.playersbar{display:flex;gap:10px;flex-wrap:wrap}
.pchip{background:rgba(255,255,255,.1);border-radius:20px;padding:5px 12px;font-size:13px}
.pchip.out{opacity:.45;text-decoration:line-through}
.myitems{margin-top:14px;font-size:13px;color:#9fb3d1;text-align:center;max-width:420px}
</style>
</head>
<body>

<div class="screen on" id="scrEnter">
 <div class="card">
  <h1>🔨 Аукцион</h1>
  <div class="sub">Торгуйся за сокровища! На старте у тебя $100</div>
  <input id="nameIn" placeholder="Твоё имя" maxlength="16">
  <button class="big" onclick="start()">🔨 Начать торги</button>
 </div>
</div>

<div class="game" id="scrGame">
 <div class="top">
  <div class="logo">🔨 Аукцион</div>
  <div class="info">
   <span>Лот <b id="lotNum">1</b>/10</span>
   <span class="money">💰 $<span id="myMoney">100</span></span>
   <span class="playersbar" id="playersBar"></span>
  </div>
  <button class="exitbtn" id="exitBtn" onclick="sellAndExit()">🚪 Продать вещи и выйти</button>
 </div>
 <div class="wrap">
  <div class="left">
   <div class="itempic" id="itemPic">🎁</div>
   <div class="itemname" id="itemName">—</div>
   <div class="itemdesc" id="itemDesc"></div>
   <div class="board">
    <div class="bidval">$<span id="curBid">0</span></div>
    <div class="leader" id="curLeader">Ставок ещё не было</div>
    <div class="timer" id="timer">—</div>
    <div class="bids">
     <button onclick="bid(5)">+5</button>
     <button onclick="bid(10)">+10</button>
     <button onclick="bid(20)">+20</button>
     <button class="go" onclick="pass()">Пас</button>
    </div>
    <div class="hint" id="hint"></div>
   </div>
   <div class="myitems" id="myItems"></div>
  </div>
  <div class="right">
   <div class="chathead">💬 Чат аукциона</div>
   <div class="msgs" id="msgs"></div>
   <div class="chatinput">
    <input id="chatIn" placeholder="Написать сообщение..." maxlength="120" onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">➤</button>
   </div>
  </div>
 </div>
 <div class="lots" id="lotsBar"></div>
</div>

<div class="screen" id="scrFinal">
 <div class="card final">
  <h1 id="finalTitle">🏁 Итоги аукциона</h1>
  <div class="sub" id="finalSub">Настоящие цены раскрыты!</div>
  <table id="finalTable"></table>
  <button class="ghost" onclick="location.reload()">🔄 Играть ещё раз</button>
 </div>
</div>

<script>
const KEY='auction_final_v3';
const ITEMS=[
 {e:'🪆',n:'Матрёшка династии Романовых',d:'Внутри — ещё семь, а в последней карта тайного знакомого.',p:45},
 {e:'⌚',n:'Золотые часы часового мастера Гусятникова',d:'Идут на 3 минуты вперёд — чтобы не опаздывать на важное.',p:80},
 {e:'🎻',n:'Скрипка старого мастера',d:'Звучит так, что соседи снизу уже написали заявление.',p:95},
 {e:'💎',n:'Бриллиант «Слеза сибирского медведя»',d:'Блестит даже в темноте и в плохом настроении.',p:150},
 {e:'🏺',n:'Ваза династии Мин',d:'Ремонтировалась суперклеем, но это придаёт ей характер.',p:60},
 {e:'🗡️',n:'Меч русского дружинника',d:'Ржавый, зато проверенный в трех мировых и одной дворовой.',p:35},
 {e:'👑',n:'Корона султана Брунея',d:'Тяжёлая. Носить только с хорошей осанкой.',p:180},
 {e:'🖼️',n:'Картина «Мужик с вилами» неизвестного художника',d:'Эксперты спорят: то ли Шишкин, то ли дядя Коля.',p:70},
 {e:'🐾',n:'Чучело лапы пещерного медведя',d:'Идеальный подарок врагу. Или другу — как посмотреть.',p:25},
 {e:'📿',n:'Чётки из янтаря',d:'Согревают душу и ладони. Иногда душу сильнее.',p:40},
 {e:'🗿',n:'Мини-моаи с острова Пасхи',d:'Смотрит осуждающе, но в душе — добрый.',p:55},
 {e:'💰',n:'Сундук с царскими монетами',d:'Часть монет — шоколадные. Не все.',p:90},
 {e:'⚔️',n:'Пара дуэльных пистолетов',d:'Заряжать нельзя: музейные. Зато вид серьёзный.',p:65},
 {e:'📜',n:'Грамота «Самому честному купцу» 1897 года',d:'Выдана купцу, который никогда не существовал.',p:30},
 {e:'🥃',n:'Бутылка коньяка 1861 года',d:'Внутри — коньяк. Наверное. Проверять рискованно.',p:85},
 {e:'💍',n:'Кольцо княгини Романовой',d:'Не маленькое и не большое — ровно на безымянный.',p:110},
 {e:'🕐',n:'Кукушка из дворца графов Шереметьевых',d:'Кукует только когда никто не слушает.',p:50},
 {e:'🧭',n:'Компас капитана Крузенштерна',d:'Иногда показывает на юг. Иногда на магазина «Пятёрочку».',p:45},
 {e:'🎺',n:'Труба духового оркестра царской армии',d:'Из неё можно играть. Или пить. Рекомендуем первое.',p:38},
 {e:'🦴',n:'Кость тираннозавра',d:'Возраст — 66 миллионов лет. Запах соответствующий.',p:130}
];
const BOTS=['Борис','Марго','Гоша','Нина'];
const BOT_REPL=['Рискну!','Дороговато, но беру!','Хм-м...','Моё!','Ну попробуй перебей!','Ладно, ещё чуть-чуть.','Это же клад!','Пас, коплю на следующее.'];
function S(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function W(s){localStorage.setItem(KEY,JSON.stringify(s))}
let me=null,lastChatLen=0;

function start(){
 const name=(document.getElementById('nameIn').value||'').trim();
 if(!name){document.getElementById('nameIn').style.border='1px solid #ff7043';return}
 me=name;
 let s=S();
 if(!s||s.phase==='over'){
  const botsEst={};
  ITEMS.forEach((it,i)=>{botsEst[i]={};BOTS.forEach((b,j)=>{botsEst[i][b]=Math.round(it.p*(0.6+Math.random()*1.3))})});
  s={phase:'lots',lot:-1,curBid:0,leader:null,lastBid:0,passed:[],
     players:{},bots:BOTS.map(b=>({name:b,bal:100,items:[],active:true,out:false})),
     chat:[],botsEst,seed:Date.now()};
  s.players[name]={bal:100,items:[],out:false};
  addChat(s,' sys','🎮 '+name+' создал аукцион! Начинаем...');
  nextLot(s);W(s);
 }else{
  if(!s.players[name]){s.players[name]={bal:100,items:[],out:false};addChat(s,' sys','🤝 '+name+' присоединился к торгам!');W(s)}
 }
 openGame();
}
function openGame(){
 document.getElementById('scrEnter').classList.remove('on');
 document.getElementById('scrGame').classList.add('on');
 setInterval(tick,700);setInterval(renderChat,500);
}
function addChat(s,cls,text){s.chat.push({cls,text,t:Date.now()});if(s.chat.length>80)s.chat.shift()}
function renderChat(){
 const s=S();if(!s)return;
 const box=document.getElementById('msgs');
 if(box.childElementCount!==s.chat.length){
  box.innerHTML='';s.chat.forEach(m=>{const d=document.createElement('div');d.className='msg'+m.cls;d.textContent=m.text;box.appendChild(d)});
  box.scrollTop=box.scrollHeight;
 }
}
function renderTop(s){
 const p=s.players[me];
 document.getElementById('myMoney').textContent=p.bal;
 document.getElementById('lotNum').textContent=Math.min(s.lot+1,ITEMS.length);
 const bar=document.getElementById('playersBar');bar.innerHTML='';
 Object.keys(s.players).forEach(n=>{const q=s.players[n];const c=document.createElement('span');c.className='pchip'+(q.out?' out':'');c.textContent=(n===me?'Вы: ':'')+q.bal+'$';bar.appendChild(c)});
 s.bots.forEach(b=>{const c=document.createElement('span');c.className='pchip'+(b.out?' out':'');c.textContent=b.name+': '+b.bal+'$';bar.appendChild(c)});
 const lb=document.getElementById('lotsBar');lb.innerHTML='';
 ITEMS.forEach((_,i)=>{const d=document.createElement('div');d.className='lotdot'+(i<s.lot?' done':i===s.lot?' cur':'');lb.appendChild(d)});
}
function renderLeft(s){
 const it=ITEMS[s.lot];
 document.getElementById('itemPic').textContent=it.e;
 document.getElementById('itemName').textContent=it.n;
 document.getElementById('itemDesc').textContent=it.d;
 document.getElementById('curBid').textContent=s.curBid;
 document.getElementById('curLeader').textContent=s.leader?('Лидер: '+s.leader):'Ставок ещё не было';
 const left=10-Math.floor((Date.now()-s.lastBid)/1000);
 document.getElementById('timer').textContent='Молоток через: '+Math.max(left,0)+' сек';
 const p=s.players[me];
 ['bid5',''].forEach(()=>{});
 document.querySelectorAll('.bids button').forEach((b,i)=>{
  if(i<3)b.disabled=p.out||p.bal<s.curBid+[5,10,20][i];
 });
 const canBid=!p.out&&p.bal>=s.curBid+5;
 document.getElementById('hint').textContent=p.out?'Вы вышли из аукциона — наблюдайте за торгами в чате':(canBid?'':'Денег не хватает! Можно продать вещи и выйти ⤴');
 const mi=document.getElementById('myItems');
 mi.textContent=p.items.length?('🎒 Ваши вещи: '+p.items.map(i=>ITEMS[i].e+' '+ITEMS[i].n).join(', ')):'';
 document.getElementById('exitBtn').style.display=p.out?'none':'inline-block';
}
function bid(add){
 const s=S();if(!s||s.phase!=='lots')return;const p=s.players[me];
 if(p.out||p.bal<s.curBid+add)return;
 p.bal-=add;s.curBid+=add;s.leader=me;s.lastBid=Date.now();s.passed=[];
 addChat(s,'','💬 <b>'+me+'</b>: ставлю $'+add+'! (итого $'+s.curBid+')'.replace('<b>','').replace('</b>',''));
 renderTop(s);W(s);
}
function pass(){
 const s=S();if(!s||s.phase!=='lots')return;
 if(!s.passed.includes(me))s.passed.push(me);
 if(s.passed.length>=humanCount(s))finalize(s);W(s);
}
function humanCount(s){return Object.keys(s.players).filter(n=>!s.players[n].out).length}
function nextLot(s){
 s.lot++;if(s.lot>=ITEMS.length){s.phase='over';finish(s);return}
 s.curBid=0;s.leader=null;s.passed=[];s.lastBid=Date.now();
 addChat(s,' sys','📦 Лот '+(s.lot+1)+': приносят «'+ITEMS[s.lot].n+'»!');
}
function botAct(s){
 if(s.phase!=='lots')return;
 const it=ITEMS[s.lot];
 s.bots.forEach((b,bi)=>{
  if(b.out)return;
  if(b.bal<s.curBid+5)return;
  const est=s.botsEst[s.lot][b.name];
  if(s.curBid>=est*1.05)return;
  if(Math.random()<(s.curBid===0?0.75:0.5)){
   const step=[5,5,10,20][bi%4];
   const add=Math.min(step,Math.max(5,est-s.curBid));
   if(b.bal<add)return;
   b.bal-=add;s.curBid+=add;s.leader=b.name;s.lastBid=Date.now();s.passed=[];
   addChat(s,'','💬 '+b.name+': '+BOT_REPL[Math.floor(Math.random()*BOT_REPL.length)]+' Ставлю $'+add+' (итого $'+s.curBid+')');
  }
 });
}
function finalize(s){
 if(s.phase!=='lots')return;
 if(s.leader){
  const winner=s.leader;
  const it=ITEMS[s.lot];
  if(s.players[winner]){s.players[winner].items.push(s.lot)}
  else{s.bots.find(b=>b.name===winner).items.push(s.lot)}
  addChat(s,' win','🔨 ПРОДАНО! «'+it.n+'» уходит к '+winner+' за $'+s.curBid);
 }else{
  addChat(s,' sys','🔨 Никто не рискнул — вещь уходит обратно на склад.');
 }
 setTimeout(()=>{const st=S();if(st&&st.phase==='lots'){nextLot(st);W(st)}},1200);
 s.phase='wait';W(s);
}
function finish(s){
 s.phase='over';
 const rows=[];
 const all=[...Object.entries(s.players).map(([n,q])=>({n,q,h:true})),...s.bots.map(b=>({n:b.name,q:b,h:false}))];
 all.forEach(r=>{if(r.q.out){r.total=r.q.bal}else{r.total=r.q.bal+r.q.items.reduce((a,i)=>a+ITEMS[i].p,0)}});
 all.sort((a,b)=>b.total-a.total);
 document.getElementById('finalTable').innerHTML='<tr><th></th><th>Игрок</th><th>Деньги</th><th>Вещи</th><th>Итог</th></tr>'+
  all.map((r,i)=>'<tr><td class="medal">'+['🥇','🥈','🥉','🏅','🏅'][i]+'</td><td>'+r.n+(r.q.out?' (вышел, продал вещи)':'')+'</td><td>$'+r.q.bal+'</td><td>'+(r.q.items.length?r.q.items.map(i=>ITEMS[i].e+' $'+ITEMS[i].p).join(', '):'—')+'</td><td><b>$'+r.total+'</b></td></tr>').join('');
 document.getElementById('scrGame').classList.remove('on');
 document.getElementById('scrFinal').classList.add('on');
}
function sellAndExit(){
 const s=S();if(!s)return;const p=s.players[me];if(p.out)return;
 if(p.items.length===0){addChat(s,' sys','🚪 '+me+' вышел из аукциона (продавать нечего).');p.out=true;W(s);if(humanCount(s)===0&&s.bots.every(b=>b.out))finish(s);return}
 let sum=0;p.items.forEach(i=>{sum+=ITEMS[i].p});
 p.bal+=sum;
 addChat(s,' win','💸 '+me+' продал свои вещи ('+p.items.map(i=>ITEMS[i].e).join(', ')+') антиквару за $'+sum+' и вышел из аукциона!');
 p.items=[];p.out=true;
 W(s);
 if(humanCount(s)===0&&s.bots.every(b=>b.out))finish(s);
}
function sendChat(){
 const s=S();if(!s)return;
 const inp=document.getElementById('chatIn');const t=(inp.value||'').trim();if(!t)return;
 addChat(s,'','💬 '+me+': '+t);inp.value='';W(s);
}
function tick(){
 const s=S();if(!s||s.phase==='over')return;
 if(s.phase==='lots'){
  if(Date.now()-s.lastBid>10000&&humanCount(s)>0&&!s.passed.every(()=>true)){}
  if(Date.now()-s.lastBid>10000){finalize(s);return}
  if(s.curBid===0&&Date.now()-s.lastBid>3000&&Math.random()<0.6)botAct(s);
  else if(Date.now()-s.lastBid>1500+((s.seed+s.lot*777)%1000))botAct(s);
  W(s);
 }
 renderTop(s);renderLeft(s);
 const p=s.players[me];
 if(p.out&&s.phase==='lots'){/* наблюдающий режим */}
 if(s.phase==='over')finish(s);
}
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
</script>
</body>
</html>
